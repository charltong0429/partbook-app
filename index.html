<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TaurisWeft local-first 专业内容编辑工作台" />
    <meta name="theme-color" content="#0d1320" />
    <title>TaurisWeft · 编辑工作台</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主要导航">
        <a class="brand-lockup" href="#today" data-view-link="today" aria-label="TaurisWeft 工作台">
          <img src="assets/brand/taurisweft-mark.svg" alt="" width="38" height="38" />
          <span>TaurisWeft</span>
        </a>

        <nav class="primary-nav">
          <button type="button" data-view="today" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>今日工作台</span>
          </button>
          <button type="button" data-view="research">
            <span class="nav-icon" aria-hidden="true">S</span>
            <span>Research</span>
            <span class="nav-count" id="brief-count">0</span>
          </button>
          <button type="button" data-view="studio">
            <span class="nav-icon" aria-hidden="true">W</span>
            <span>Studio</span>
          </button>
          <button type="button" data-view="library">
            <span class="nav-icon" aria-hidden="true">L</span>
            <span>Library</span>
            <span class="nav-count" id="draft-count">0</span>
          </button>
          <button type="button" data-view="brand">
            <span class="nav-icon" aria-hidden="true">B</span>
            <span>Brand Memory</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="local-mode">
            <span class="status-pulse" aria-hidden="true"></span>
            <div>
              <strong>本地可用模式</strong>
              <span>数据只保存在此浏览器</span>
            </div>
          </div>
          <a href="about.html">查看品牌介绍</a>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
          <div class="breadcrumb">
            <span>PERSONAL WORKSPACE</span>
            <strong id="view-title">今日工作台</strong>
          </div>
          <div class="topbar-actions">
            <button class="quiet-button" type="button" id="export-workspace">导出数据</button>
            <label class="quiet-button file-button">
              导入数据
              <input id="import-workspace" type="file" accept="application/json" />
            </label>
            <button class="primary-button" type="button" data-action="new-brief">+ 新建 Brief</button>
          </div>
        </header>

        <div class="mode-banner" role="note">
          <strong>现在可以真实使用。</strong>
          <span>Research、Brand Memory、双平台草稿、版本、Ready 状态、Copy 与导出都在浏览器内运行。当前不调用外部 AI，也不会上传你的材料。</span>
          <button type="button" data-dismiss-banner aria-label="关闭说明">×</button>
        </div>

        <main id="app-main" tabindex="-1"></main>
      </section>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
